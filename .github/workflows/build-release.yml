name: Build and Release UnyCloud

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: false

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build for ARM64
        run: |
          GOOS=linux GOARCH=arm64 go build -o dist/unycloud-arm64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unycloud-arm64
          path: dist/unycloud-arm64
